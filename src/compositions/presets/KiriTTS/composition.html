<template id="kiritts-preset-template">
  <style>
    @font-face {
      font-family: "SF Pro Display";
      font-style: normal;
      font-weight: 400;
      font-display: block;
      src: url("__ASSET_SF_FONT_BASE__SFPRODISPLAYREGULAR.OTF")
        format("opentype");
    }
    @font-face {
      font-family: "SF Pro Display";
      font-style: normal;
      font-weight: 500;
      font-display: block;
      src: url("__ASSET_SF_FONT_BASE__SFPRODISPLAYMEDIUM.OTF")
        format("opentype");
    }
    @font-face {
      font-family: "SF Pro Display";
      font-style: normal;
      font-weight: 700;
      font-display: block;
      src: url("__ASSET_SF_FONT_BASE__SFPRODISPLAYBOLD.OTF") format("opentype");
    }
    /* Khmer is set in Kantumruy Pro, not left to a system fallback. Bundled
       as the Khmer subset so preview and export render it identically. */
    @font-face {
      font-family: "Kantumruy Pro";
      font-style: normal;
      font-weight: 100 700;
      font-display: block;
      src: url("__ASSET_KHMER_FONT_BASE__KantumruyPro-Khmer.woff2")
        format("woff2");
    }
    .kiri-film,
    .kiri-film * {
      box-sizing: border-box;
    }
    .kiri-film {
      --ink: #f3f3f6;
      --dim: #a6a6b1;
      --faint: #74747f;
      --accent: #f0a44a;
      --line: #ffffff1c;
      --plate: #131316;
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090909;
      color: var(--ink);
      font-family:
        "SF Pro Display",
        -apple-system,
        Inter,
        sans-serif;
      font-weight: 400;
    }
    .kiri-film h1,
    .kiri-film p {
      margin: 0;
    }
    .kiri-film button {
      font: inherit;
      border: 0;
      color: inherit;
      background: none;
    }
    /* Perspective sits on the two containers whose children actually rotate,
       and nothing declares preserve-3d. A shared 3D context would sort the
       ground plane against the tilted panel and render their intersection as
       a hard diagonal seam across the frame. */
    .kiri-world {
      position: absolute;
      inset: 0;
      perspective: 2000px;
      perspective-origin: 50% 50%;
    }
    .kiri-layer {
      position: absolute;
      inset: 0;
      perspective: 2000px;
      perspective-origin: 50% 50%;
    }
    /* The lit ground lives outside the camera world, so the light source is
       fixed to the frame and cannot drift in and out as the camera moves. */
    .kiri-bloom {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 2400px;
      height: 1700px;
      margin: -850px 0 0 -1200px;
      background: radial-gradient(
        ellipse at center,
        rgba(255, 255, 255, 0.05),
        rgba(255, 255, 255, 0.018) 40%,
        transparent 68%
      );
      pointer-events: none;
    }
    .kiri-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
      background-size: 88px 88px;
      pointer-events: none;
    }
    .kiri-khmer {
      font-family: "Kantumruy Pro", "SF Pro Display", sans-serif;
      /* Khmer stacks diacritics above and below the baseline and it must not
         be tracked in like the Latin display face. */
      line-height: 1.52;
      letter-spacing: 0;
    }
    .kiri-hook-khmer {
      font-size: 92px;
      font-weight: 700;
    }
    .kiri-app-mark {
      display: grid;
      place-items: center;
      flex: none;
      width: 34px;
      height: 34px;
    }
    .kiri-app-mark img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* ---- Editorial type ------------------------------------------------- */
    .kiri-title {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1560px;
      text-align: center;
      font-size: 96px;
      font-weight: 700;
      line-height: 1.06;
      letter-spacing: -0.042em;
    }
    .kiri-title em {
      font-style: normal;
      color: var(--ink);
    }
    .kiri-kicker {
      position: absolute;
      left: 50%;
      top: 50%;
      font-size: 24px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--faint);
      white-space: nowrap;
    }

    /* ---- Icons ---------------------------------------------------------- */
    .kiri-ic {
      width: 1em;
      height: 1em;
      flex: none;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.85;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ---- The brand tile, carried across the whole film ------------------ */
    .kiri-mark {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 300px;
      height: 300px;
      border-radius: 90px;
      z-index: 18;
      overflow: hidden;
      background: linear-gradient(150deg, #2a2a31, #16161a 62%);
      border: 1px solid #ffffff22;
      box-shadow:
        0 60px 130px #000000a6,
        inset 0 1px 0 #ffffff14;
    }
    .kiri-mark img {
      position: absolute;
      left: 57px;
      top: 57px;
      width: 186px;
      height: 186px;
      object-fit: contain;
    }
    .kiri-wordmark {
      position: absolute;
      left: 50%;
      top: 50%;
      font-size: 92px;
      font-weight: 700;
      letter-spacing: -0.055em;
      white-space: nowrap;
    }

    /* ---- The shared stage carrier: no paint of its own ------------------ */
    .kiri-stage {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1180px;
      height: 150px;
      border-radius: 26px;
      z-index: 24;
    }
    .kiri-face {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      overflow: hidden;
      background: linear-gradient(150deg, #202026, #141418);
      border: 1px solid var(--line);
      box-shadow: 0 40px 110px #00000080;
    }

    /* ---- Audio player face ---------------------------------------------- */
    .kiri-audio-face {
      display: flex;
      align-items: center;
      gap: 30px;
      padding: 0 40px;
    }
    .kiri-transport {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #ffffff10;
      border: 1px solid #ffffff22;
      font-size: 26px;
    }
    .kiri-wave-wrap {
      position: relative;
      flex: 1;
      height: 100%;
      min-width: 0;
    }
    .kiri-wave {
      position: absolute;
      inset: 14px 0;
    }
    .kiri-wave svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }
    .kiri-wave rect {
      transform-box: fill-box;
      transform-origin: center;
    }
    .kiri-wave-base rect {
      fill: #ffffff2e;
    }
    .kiri-wave-played rect {
      fill: var(--accent);
    }
    .kiri-playhead {
      position: absolute;
      top: 6px;
      bottom: 6px;
      left: 0;
      width: 2px;
      border-radius: 2px;
      background: var(--ink);
      box-shadow: 0 0 14px #ffffff8c;
    }
    .kiri-audio-time {
      font-size: 22px;
      font-weight: 500;
      color: var(--dim);
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .kiri-audio-label {
      position: absolute;
      left: 50%;
      top: 50%;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 21px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--faint);
      white-space: nowrap;
    }
    .kiri-audio-label .kiri-ic {
      font-size: 24px;
      color: var(--accent);
    }

    /* ---- Upload face (Speech to Text) ----------------------------------- */
    .kiri-drop-face {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      text-align: center;
    }
    .kiri-segmented {
      display: flex;
      gap: 6px;
      padding: 6px;
      border-radius: 16px;
      background: #ffffff0d;
      border: 1px solid var(--line);
      font-size: 23px;
      font-weight: 500;
    }
    .kiri-segmented span {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 26px;
      border-radius: 11px;
      color: var(--dim);
    }
    .kiri-segmented span:first-child {
      background: #ededf0;
      color: #17171a;
    }
    .kiri-drop-icon {
      width: 108px;
      height: 108px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #ffffff0f;
      border: 1px solid #ffffff1f;
      font-size: 46px;
    }
    .kiri-drop-title {
      font-size: 40px;
      font-weight: 500;
      letter-spacing: -0.025em;
    }
    .kiri-drop-note {
      font-size: 23px;
      line-height: 1.45;
      color: var(--dim);
    }
    .kiri-choose {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 17px 32px;
      border-radius: 999px;
      background: #ededf0;
      color: #17171a;
      font-size: 24px;
      font-weight: 500;
    }

    /* ---- Transcript face ------------------------------------------------ */
    .kiri-transcript {
      padding: 34px 46px;
      background: linear-gradient(170deg, #17171b, #121215);
    }
    .kiri-doc-header {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 23px;
      font-weight: 500;
      color: var(--dim);
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
    }
    .kiri-doc-header .kiri-ic {
      font-size: 26px;
      color: var(--accent);
    }
    .kiri-doc-status {
      margin-left: auto;
      color: var(--faint);
    }
    .kiri-doc-chip {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 7px 15px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #ffffff08;
      font-size: 20px;
      color: var(--dim);
    }
    .kiri-doc-chip .kiri-ic {
      font-size: 21px;
      color: var(--accent);
    }
    .kiri-segment {
      margin-top: 24px;
      padding-left: 22px;
      border-left: 3px solid #b0bdd6;
    }
    .kiri-segment:nth-of-type(2) {
      border-color: #c9ab7a;
    }
    .kiri-segment:nth-of-type(3) {
      border-color: #a9c0ab;
    }
    .kiri-segment-meta {
      display: flex;
      justify-content: space-between;
      font-size: 21px;
      font-weight: 500;
      color: var(--faint);
      margin-bottom: 9px;
    }
    .kiri-segment p {
      font-size: 33px;
      line-height: 1.26;
      letter-spacing: -0.018em;
    }
    .kiri-export-controls {
      position: absolute;
      left: 46px;
      right: 46px;
      bottom: 32px;
      display: flex;
      align-items: center;
      gap: 11px;
    }
    .kiri-format {
      border: 1px solid #ffffff26;
      border-radius: 11px;
      padding: 12px 19px;
      font-size: 22px;
      font-weight: 500;
      color: var(--dim);
    }
    .kiri-format:first-child {
      background: #ededf0;
      border-color: #ededf0;
      color: #1a1a1d;
    }
    .kiri-export-button {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 11px;
      border-radius: 12px;
      padding: 15px 30px;
      background: #ededf0;
      color: #1a1a1d;
      font-size: 24px;
      font-weight: 500;
    }

    /* ---- The Generate Speech application panel -------------------------- */
    .kiri-app {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1660px;
      height: 880px;
      border-radius: 22px;
      overflow: hidden;
      background: #0e0e10;
      border: 1px solid #ffffff1a;
      box-shadow:
        0 90px 180px #000000b3,
        inset 0 1px 0 #ffffff12;
    }
    .kiri-app-bar {
      height: 74px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 30px;
      border-bottom: 1px solid #ffffff14;
      font-size: 22px;
      font-weight: 500;
    }
    .kiri-app-bar .kiri-ic {
      font-size: 22px;
      color: var(--dim);
    }
    .kiri-crumb-sep {
      color: var(--faint);
    }
    .kiri-crumb-dim {
      color: var(--dim);
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .kiri-app-bar-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .kiri-credits {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 18px;
      border-radius: 999px;
      background: #ffffff0d;
      border: 1px solid var(--line);
      color: var(--accent);
      font-size: 21px;
      font-weight: 500;
    }
    .kiri-iconbtn {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      background: #ffffff0a;
      border: 1px solid var(--line);
      font-size: 21px;
      color: var(--dim);
    }
    .kiri-app-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(140deg, #f0a44a, #b46a22);
      color: #17120a;
      font-size: 20px;
      font-weight: 700;
    }
    .kiri-app-body {
      display: flex;
      height: 806px;
    }
    .kiri-app-main {
      position: relative;
      flex: 1;
      padding: 30px 42px;
      min-width: 0;
    }
    .kiri-voice-pill {
      display: inline-flex;
      align-items: center;
      gap: 13px;
      padding: 13px 22px;
      border-radius: 999px;
      background: #ffffff0d;
      border: 1px solid #ffffff24;
      font-size: 24px;
      font-weight: 500;
    }
    .kiri-mic-dot {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #ffffff14;
      font-size: 19px;
    }
    .kiri-chevron {
      font-size: 22px;
      color: var(--dim);
    }
    .kiri-composer {
      position: relative;
      margin-top: 22px;
      height: 322px;
      border-radius: 18px;
      background: var(--plate);
      border: 1px solid var(--line);
      padding: 28px 32px;
      font-size: 36px;
      line-height: 1.34;
      letter-spacing: -0.022em;
    }
    /* The hint is lifted out of flow so the typed script starts at the
       caret position rather than after the placeholder it replaces. */
    .kiri-placeholder {
      position: absolute;
      left: 32px;
      right: 32px;
      top: 28px;
      color: var(--faint);
    }
    .kiri-caret {
      display: inline-block;
      width: 3px;
      height: 38px;
      background: var(--ink);
      vertical-align: -6px;
      margin-left: 3px;
    }
    .kiri-composer-tools {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 20px;
      font-size: 22px;
      font-weight: 500;
      color: var(--dim);
    }
    .kiri-composer-tools span {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 11px 22px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #ffffff08;
    }
    .kiri-starters {
      position: absolute;
      left: 42px;
      right: 42px;
      bottom: 130px;
    }
    .kiri-starters-label {
      font-size: 21px;
      color: var(--faint);
      margin-bottom: 14px;
    }
    .kiri-starter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 11px;
      font-size: 21px;
      font-weight: 500;
      color: var(--dim);
    }
    .kiri-starter-row span {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 11px 20px;
      border-radius: 999px;
      border: 1px solid var(--line);
    }
    .kiri-app-footer {
      position: absolute;
      left: 42px;
      right: 42px;
      bottom: 34px;
      display: flex;
      align-items: center;
      font-size: 22px;
      font-weight: 500;
      color: var(--dim);
    }
    .kiri-import {
      display: flex;
      align-items: center;
      gap: 11px;
    }
    .kiri-count {
      margin-left: auto;
      margin-right: 26px;
      color: var(--faint);
      letter-spacing: 0.04em;
    }
    .kiri-generate {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 17px 32px;
      border-radius: 999px;
      background: #ededf0;
      color: #17171a;
      font-size: 24px;
      font-weight: 500;
      white-space: nowrap;
    }
    .kiri-app-side {
      width: 470px;
      border-left: 1px solid #ffffff14;
      padding: 26px 30px;
      background: #0c0c0e;
    }
    .kiri-tabs {
      display: flex;
      gap: 26px;
      font-size: 22px;
      font-weight: 500;
      color: var(--faint);
      border-bottom: 1px solid #ffffff12;
    }
    .kiri-tabs span {
      padding-bottom: 14px;
    }
    .kiri-tabs span:first-child {
      color: var(--ink);
      box-shadow: inset 0 -2px 0 var(--ink);
    }
    .kiri-side-block {
      margin-top: 24px;
    }
    .kiri-side-title {
      font-size: 22px;
      font-weight: 500;
    }
    .kiri-side-note {
      font-size: 19px;
      color: var(--faint);
      margin-top: 6px;
    }
    .kiri-side-label {
      font-size: 21px;
      font-weight: 500;
      margin-bottom: 11px;
    }
    .kiri-side-select {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 13px;
      background: #ffffff0a;
      border: 1px solid var(--line);
      font-size: 21px;
      color: var(--dim);
    }
    .kiri-side-select .kiri-mic-dot {
      width: 30px;
      height: 30px;
      font-size: 17px;
      color: var(--ink);
    }
    .kiri-side-select .kiri-chevron {
      margin-left: auto;
      font-size: 20px;
    }
    .kiri-slider-head {
      display: flex;
      align-items: baseline;
      font-size: 21px;
      font-weight: 500;
    }
    .kiri-slider-head b {
      margin-left: auto;
      font-weight: 500;
      color: var(--dim);
    }
    .kiri-track {
      position: relative;
      height: 4px;
      border-radius: 2px;
      background: #ffffff1c;
      margin: 15px 0 10px;
    }
    .kiri-track i {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      border-radius: 2px;
      background: #e9e9ee;
    }
    .kiri-thumb {
      position: absolute;
      top: 50%;
      width: 17px;
      height: 17px;
      margin: -8.5px 0 0 -8.5px;
      border-radius: 50%;
      background: #f2f2f5;
      box-shadow: 0 2px 8px #0009;
    }
    .kiri-track-ends {
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      color: var(--faint);
    }
    .kiri-side-heading {
      font-size: 17px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--faint);
      margin-top: 30px;
    }
    .kiri-side-row {
      display: flex;
      align-items: center;
      font-size: 21px;
      font-weight: 500;
      margin-top: 18px;
    }
    .kiri-mini-select {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px;
      border-radius: 11px;
      border: 1px solid var(--line);
      background: #ffffff0a;
      font-size: 19px;
      color: var(--dim);
    }
    .kiri-toggle {
      margin-left: auto;
      width: 52px;
      height: 30px;
      border-radius: 999px;
      background: #ededf0;
      position: relative;
    }
    .kiri-toggle::after {
      content: "";
      position: absolute;
      right: 3px;
      top: 3px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #17171a;
    }

    /* ---- The voice picker, opened --------------------------------------- */
    .kiri-voice-menu {
      position: absolute;
      left: 42px;
      top: 92px;
      width: 560px;
      border-radius: 20px;
      background: #171719;
      border: 1px solid #ffffff26;
      box-shadow: 0 50px 120px #000000bf;
      padding: 14px;
      z-index: 6;
      transform-origin: 18% 0%;
    }
    .kiri-voice-list {
      height: 392px;
      overflow: hidden;
    }
    .kiri-voice-count {
      margin-left: auto;
      font-size: 18px;
      color: var(--faint);
    }
    .kiri-voice-search {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 16px;
      border-radius: 13px;
      background: #ffffff0a;
      border: 1px solid var(--line);
      font-size: 21px;
      color: var(--faint);
      margin-bottom: 12px;
    }
    .kiri-voice-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 15px 16px;
      border-radius: 14px;
      border: 1px solid transparent;
    }
    .kiri-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #ffffff16;
      font-size: 22px;
      font-weight: 500;
    }
    .kiri-voice-row strong {
      display: block;
      font-size: 25px;
      font-weight: 500;
      letter-spacing: -0.015em;
    }
    .kiri-voice-row small {
      display: block;
      font-size: 19px;
      color: var(--faint);
      margin-top: 4px;
    }
